name: Wekelijkse hertraining
# Draait alleen op de default branch: GitHub plant schema's uitsluitend
# daarvandaan, en een workflow verschijnt pas in het Actions-overzicht nadat
# hij een keer op die branch is gedraaid of ernaartoe is gepusht.
on:
  schedule:
    - cron: "17 3 * * 1"      # elke maandag 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hertrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy "scikit-learn>=1.8,<1.9" scipy

      - name: Modellen controleren
        run: python weerbot-modellen/controleer_upload.py

      - name: Bundelbestand controleren
        run: python weerbot-modellen/pak_features.py check

      - name: Bundel uitpakken naar uit_features
        run: python weerbot-modellen/pak_features.py uit

      - name: Data bijwerken en modellen hertrainen
        working-directory: weerbot-modellen
        run: python deel9_wekelijks.py

      - name: Terug inpakken tot een bestand
        run: python weerbot-modellen/pak_features.py in

      - name: Wijzigingen committen
        run: |
          git config user.name "weerbot-actie"
          git config user.email "actions@users.noreply.github.com"
          git add weerbot-modellen/features_alle.csv \
                  weerbot-modellen/klim_features.csv \
                  weerbot-modellen/modellen/modellen.json \
                  weerbot-modellen/modellen/pooled_gbm.pkl
          if git diff --cached --quiet; then
            echo "  geen wijziging"
            exit 0
          fi
          git commit -m "Wekelijkse hertraining"
          # Een andere actie kan ondertussen gepusht hebben. Zonder deze rebase
          # wordt de push afgewezen met "fetch first" en valt de run om terwijl
          # er niets mis is met het werk. De vier andere acties deden dit al;
          # deze twee waren de uitzondering, en dat viel niet op zolang de
          # planning ze netjes uit elkaar hield. Sinds GitHub de geplande runs
          # vertraagt -- de portefeuille draait op :12 maar komt op willekeurige
          # minuten, met gaten van drie tot vijf uur -- klonteren ze samen en is
          # het een kwestie van tijd.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
