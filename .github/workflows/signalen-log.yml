name: Signalenlog

# Draait bot/logger.py en bot/signalen.py en commit de logs. Zonder deze actie
# bestaat de modelkans per temperatuurvak alleen vluchtig in de browser en valt
# er achteraf niets te meten: de vier dagen in logs/ zijn met de hand ontstaan.
#
# Vier keer per dag op :41, want:
#   - de bestaande acties pushen om 02:23 en 14:23 (klim), maandag 03:17
#     (hertraining) en maandag 05:23 (kalibratie). Op :41 zit deze actie van
#     geen van die starttijden binnen een kwartier, en de commitstap doet
#     git pull --rebase, zodat een langlopende maandagactie die later pusht
#     alsnog geen botsing geeft.
#   - een markt loopt tot het einde van de dag in de stad zelf, en dat moment
#     verschilt per stad. Het veld endDate in de Gamma-API staat weliswaar voor
#     iedereen op 12:00 UTC, maar dat is alleen voor Wellington het einde van de
#     lokale dag; zie uren_tot in bot/signalen.py. In UTC lopen de sluitingen
#     van 12:00 (Wellington) via 15:00 en 16:00 (Oost-Azie) en 22:00 en 23:00
#     (Europa) door tot 03:00 en 07:00 de volgende ochtend (Amerika). Er bestaat
#     dus geen moment dat voor alle steden vlak voor sluiting ligt, en de oude
#     reden om er een run op 11:41 tegenaan te leggen vervalt daarmee.
#   - vier runs op 24 uur betekenen dat elk vakje precies vier keer in het
#     venster van 36 tot 12 uur voor de eigen sluiting valt, welke sluitingstijd
#     die stad ook heeft; elk vakje staat er via lead 2, 1 en 0 zo'n tien tot
#     twaalf keer in op steeds andere afstanden tot sluiting. Met de gelijke
#     tussenpozen van zes uur (in plaats van 5, 6, 7 en 6) is de laatste meting
#     voor de sluiting van een stad nooit ouder dan zes uur, en zijn de
#     afstanden voor elke stad even dicht opeen. Dat is wat de venstervraag in
#     REVIEW.md nodig heeft.
#   - niet op het hele uur: daar staat de wachtrij van GitHub het langst en
#     lopen geplande acties het meest uit.
# Draait alleen op de default branch: GitHub plant schema's uitsluitend
# daarvandaan, en een workflow verschijnt pas in het Actions-overzicht nadat
# hij een keer op die branch is gedraaid of ernaartoe is gepusht.
on:
  schedule:
    - cron: "41 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  signalen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # logger.py en signalen.py gebruiken alleen de standaardbibliotheek.

      - name: Ensemblelog bijwerken
        # logger.py geeft een foutcode zodra er minder dan 100 ensembleregels
        # zijn weggeschreven; deze stap valt dan om, zoals de bedoeling is.
        run: python bot/logger.py

      - name: Signalen loggen
        # Een stad zonder markt is geen fout: signalen.py slaat die over en
        # meldt het onderaan. Falen doet hij alleen als er geen enkele regel is.
        run: python bot/signalen.py

      - name: TAF loggen
        # Levert nog geen cijfer aan: TAF_GEWICHT staat op nul tot
        # kalibratie.leer_taf veertig gematchte dagen heeft. Loggen begint wel
        # meteen, want zonder reeks valt er later niets te leren. Een station
        # zonder TAF is geen fout.
        continue-on-error: true
        run: python bot/taf.py

      # De portefeuille stond hier tussen en draait nu elk uur in een eigen
      # actie (.github/workflows/portefeuille.yml). Vier keer per dag klopt voor
      # het weerbeeld, want ECMWF en GFS draaien zelf elke zes uur, maar niet
      # voor open posities: die veranderen wanneer er gehandeld wordt. Door de
      # twee te scheiden schrijft elke actie ook zijn eigen bestanden, en kan
      # een rebase tussen de twee nooit botsen.

      - name: Committen
        run: |
          git config user.name "weerbot-actie"
          git config user.email "actions@users.noreply.github.com"
          # Alleen de vier logboeken van deze actie. portfolio.json en
          # logs/portfolio_history.csv zijn van de actie Portefeuille.
          # taf_log.csv hoort er expliciet bij: die reeks is het enige wat
          # kalibratie.leer_taf later heeft om een gewicht op te leren, en
          # een niet-gecommit logboek is een reeks die nooit begint.
          git add logs/ensemble_log.csv logs/nws_log.csv logs/signalen.csv \
                  logs/taf_log.csv
          if git diff --cached --quiet; then
            echo "  geen wijziging"
            exit 0
          fi
          git commit -m "Signalen- en ensemblelog"
          # een andere actie kan ondertussen gepusht hebben
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
