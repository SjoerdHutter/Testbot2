name: Zelftest

# Bewaakt twee dingen die stil kapot kunnen gaan: de rekenkern in index.html
# moet exact hetzelfde uitrekenen als bot/kalibratie.py, en de manifestregels
# van de vaste bestanden moeten kloppen.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  zelftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-bestanden compileren
        run: python -m compileall -q bot weerbot-modellen

      - name: Bestanden controleren
        run: python weerbot-modellen/controleer_upload.py

      - name: Schilversie controleren
        # Valt om zodra een schilbestand wijzigt zonder dat de servicewerker een
        # nieuwe versie kreeg. Zonder deze stap houden bezoekers de oude pagina,
        # en dat is op het scherm niet te zien: hij laadt, hij is alleen oud.
        run: python weerbot-modellen/controleer_schil.py

      - name: Bundelbestand controleren
        run: python weerbot-modellen/pak_features.py check

      - name: Correctiekern testen (python en javascript)
        run: python bot/test_kern.py

      - name: Portefeuillebewaking testen
        # Draait offline: het modelbeeld is in de test verzonnen, zodat de
        # kleurregels los van Open-Meteo en Polymarket toetsbaar blijven.
        run: python bot/test_portfolio.py

      - name: Intraday-conditionering testen
        # Bewaakt vooral dat een reeks zonder waarneming exact rekent zoals
        # daarvoor: de conditionering mag lead 1 en 2 met geen cijfer raken.
        run: python bot/test_waarneming.py

      - name: Inzetregel testen
        run: python bot/test_inzet.py

      - name: TAF-laag testen
        run: python bot/test_taf.py
